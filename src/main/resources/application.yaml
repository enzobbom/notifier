spring:
  application:
    name: ts-notifier
    description: 'Task Scheduler - Notifier module'
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${TS_SMTP_EMAIL:}
    password: ${TS_SMTP_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000
  thymeleaf:
    enable: true
  rabbitmq:
    host: ${TS_RABBITMQ_HOST:localhost}
    port: ${TS_RABBITMQ_PORT:5672}
    username: ${TS_RABBITMQ_NOTIFIER_USER:guest}
    password: ${TS_RABBITMQ_NOTIFIER_PASSWORD:guest}
    virtual-host: ${TS_RABBITMQ_VHOST:/}
server:
  port: 8082
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false
sending:
  email:
    sender: ${TS_SMTP_EMAIL:}
    senderName: 'Javanauta'
